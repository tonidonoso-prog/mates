name: Desperta l'app
on:
  schedule:
    - cron: "17 * * * *"   # cada hora: GitHub se salta moltes passades (amb 6 h nomes en feia 2 al dia)
  workflow_dispatch:
jobs:
  desperta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python .github/desperta.py
